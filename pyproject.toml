[project]
name = "parrotink"
version = "0.2.41"
description = "Real-time voice-to-text application for Windows"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Aalwattar", email = "4478356+Aalwattar@users.noreply.github.com" }
]
keywords = [
    "parrotink",
    "voice-to-text",
    "speech-to-text",
    "real-time-transcription",
    "multilingual",
    "ai-dictation",
    "windows-native",
    "low-latency",
    "arabic-stt",
    "rtl-support"
]
dependencies = [
    "sounddevice==0.5.5",
    "numpy==2.4.6",
    "websockets==16.0",
    "httpx==0.28.1",
    "openai==2.44.0",
    "assemblyai==0.64.21",
    "pystray==0.19.5",
    "pynput==1.8.2",
    "keyring==25.7.0",
    "pywin32==312; sys_platform == 'win32'",
    "platformdirs==4.10.0",
    "soxr>=1.0.0",
    "skia-python==144.0.post2",
    "tomli-w>=1.2.0",
    "win11toast",
    "ttkbootstrap==1.20.4",
    "darkdetect>=0.8.0",
    "packaging>=26.0",
    "tomlkit>=0.14.0",
]

[project.urls]
Homepage = "https://github.com/Aalwattar/ParrotInk"
Issues = "https://github.com/Aalwattar/ParrotInk/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov==7.1.0",
    "ruff==0.15.20",
    "mypy>=1.20.0",
    "types-requests==2.33.0.20260518",
    "types-setuptools==82.0.0.20260518",
    "types-pynput==1.8.1.20260603",
    "types-pywin32==312.0.0.20260609",
    "pyinstaller==6.21.0",
    "pre-commit>=4.5.1",
    "pytest-timeout>=2.4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = ["hotkey_review_pack", "scripts", "nanobanana-output"]
# strict = true # Uncomment if you want to go full strict mode

[[tool.mypy.overrides]]
module = [
    "sounddevice",
    "pywin32",
    "win32gui",
    "win32api",
    "win32con",
    "win32process",
    "pystray",
    "pynput",
    "skia",
    "pynput.*",
    "websockets.*",
    "assemblyai.*",
    "openai.*",
    "tomli_w.*"
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "win11toast"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --timeout=45 --timeout-method=thread"
# Session timeout of 15 minutes to prevent CI drift
session_timeout = 900
testpaths = [
    "tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::ResourceWarning",
    "error::pytest.PytestUnhandledThreadExceptionWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
# Enable faulthandler to dump tracebacks on timeout
faulthandler_timeout = 60
asyncio_mode = "auto"
